<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Recipe Generator</title>
    <meta name="description" content="Recipes Generator">
    <meta name="author" content="John6tain">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.6.0/font/bootstrap-icons.css"
          integrity="sha384-7ynz3n3tAGNUYFZD3cWe5PDcE36xj85vyFkawcF6tIwxvIecqKvfwLiaFdizhPpN" crossorigin="anonymous">


</head>

<body class="bg-dark">
<!--TOASTER-->
<div aria-live="polite" aria-atomic="true" class="position-relative">
  <div class="toast-container position-absolute top-0 end-0 p-3">

    <!-- Then put toasts within -->
    <div id="toaster" class="toast  text-white" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header text-white">
        <strong class="me-auto">Recipe Generator</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div id="toast-content" class="toast-body">
      </div>
    </div>
</div>
  <!--TOASTER-->
<div class="container">
    <div class="row">
        <div class="mt-5">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
                    integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
                    crossorigin="anonymous"></script>
            <div class="input-group mb-3">
                <input type="text" class="form-control" aria-label="Text input with dropdown button" id="recepieSearch"
                       placeholder="Търси рецепта">
                <button class="btn btn-outline-secondary bg-dark bg-gradient" type="button" style="color: white;"
                        data-bs-toggle="modal" data-bs-target="#staticBackdrop">Добави рецепта
                </button>
                <button class="btn btn-outline-secondary bg-dark bg-gradient" type="button" style="color: white;"
                        id="allRecepies">Покажи всички рецепти
                </button>
                <button class="btn btn-outline-secondarybg-dark bg-gradient " type="button" style="color: white;"
                        id="generateRecepie">Предложи рецепта
                </button>
            </div>
            <div class="accordion d-none" id="accordionExample">
            </div>
        </div>
    </div>
<!--  MODAL-->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
         aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content bg-dark bg-gradient text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="staticBackdropLabel" contenteditable="true">Въведете рецепта</h5>
                    <button type="button" class="btn-close" id="closeModalBtn" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="recepieInput" class="col-form-label">Име на Рецепта</label>
                        <input type="text" class="form-control" id="recepieInput">
                    </div>
                    <div class="mb-3">
                        <label for="recipe-content" class="col-form-label">Съдържание на рецепта:</label>
                        <div class="p-2 overflow-scroll bg-white text-dark"   style="min-height: 150px; max-height: 400px;" contenteditable="true"
                             id="recipe-content">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary bg-dark bg-gradient text-white"
                                id="addRecepie">Запази
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--MODAL-->
<script src="./index.js"></script>
</body>
</html>
